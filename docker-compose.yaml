version: "2.4"

services:
  kkk:
    image: alpine:3.22
    platform: linux/amd64
    working_dir: /app
    command: ["/app/kkk-linux-amd64"]
    init: true
    restart: unless-stopped
    volumes:
      - ./kkk-linux-amd64:/app/kkk-linux-amd64:ro
      - ./config.json:/app/config.json:ro
      - /root/key:/root/key:ro
      - /root/dingkey:/root/dingkey:ro
